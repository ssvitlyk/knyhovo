<style>
/* ── LAYOUT ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }
.page { max-width: 1320px; margin: 0 auto; padding: 0 48px; }

/* ── HEADER (frozen v1.0 pattern) ───────────── */
.site-header { display: flex; align-items: center; gap: var(--space-8); height: 72px; }
.site-brand { display: flex; align-items: center; }
.site-logo { height: 64px; display: block; margin-left: -9px; }
.site-nav { display: flex; gap: 32px; margin-left: auto; }
.nav-link { font-size: 16px; font-weight: 500; color: var(--text-body); transition: color 140ms ease-out; text-decoration: none; }
.nav-link:hover { color: var(--accent); }
.nav-link--active { color: var(--accent); font-weight: 600; }
.site-actions { display: flex; align-items: center; gap: var(--space-5); margin-left: var(--space-8); margin-right: -9px; }
.site-actions .kn-btn { height: 40px; padding: 0 20px; font-size: 14px; font-weight: 600; border-radius: 10px; }

/* ── SECTION HEADER ─────────────────────────── */
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.sec-head__left { display: flex; flex-direction: column; gap: 4px; }
.sec-eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
.sec-title { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; line-height: 1.15; }
.sec-all { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; transition: opacity 140ms; }
.sec-all:hover { opacity: .7; }

/* ── FROZEN v1.0 — «Книговик радить» FEATURED CARD (DO NOT EDIT) ── */
.feat-card {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: 28px; padding: 18px 32px; height: 204px; overflow: hidden;
  background: var(--surface-accent); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-sm);
  margin-bottom: 64px; margin-top: 56px; text-decoration: none; color: inherit;
  transition: box-shadow 200ms ease-out, transform 200ms ease-out;
}
.feat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
[data-theme="dark"] .feat-card { background: #0a0909; }
[data-theme="light"] .feat-card { background: #f2dbc1; }
.feat-mascot {
  width: 236px; height: 163px; object-fit: cover; flex-shrink: 0; display: block;
  -webkit-mask-image: radial-gradient(ellipse 60% 66% at 50% 50%, #000 46%, transparent 78%);
  mask-image: radial-gradient(ellipse 60% 66% at 50% 50%, #000 46%, transparent 78%);
}
.feat-body { flex: 1; }
.feat-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
.feat-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.feat-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
.feat-desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 52ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.feat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.feat-count { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
.feat-count-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; text-align: right; }

/* ── BOOK SHELF (horizontal cover rail) ─────── */
.shelf { margin-bottom: 64px; }
.shelf-rail {
  display: flex; gap: 26px; overflow-x: auto; padding: 6px 2px 20px;
  scroll-snap-type: x proximity; scroll-padding-left: 2px;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
}
.shelf-rail::-webkit-scrollbar { height: 6px; }
.shelf-rail::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
.shelf-rail::-webkit-scrollbar-track { background: transparent; }
.shelf-book { flex: 0 0 auto; width: 150px; scroll-snap-align: start; text-decoration: none; color: inherit; display: block; }
.shelf-cover-wrap {
  position: relative; width: 150px; height: 225px; border-radius: 10px; overflow: hidden;
  box-shadow: var(--shadow-md); transition: transform 200ms ease-out, box-shadow 200ms ease-out;
}
.shelf-book:hover .shelf-cover-wrap { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.shelf-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
.shelf-badge {
  position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700;
  padding: 4px 9px; border-radius: 999px; letter-spacing: .2px; line-height: 1;
  box-shadow: var(--shadow-sm);
}
.shelf-badge--accent { background: var(--accent); color: var(--text-on-accent); }
.shelf-badge--green  { background: var(--brand-green); color: #fff; }
.shelf-badge--solid  { background: var(--text); color: var(--bg); }
.shelf-book__title { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.25; margin-top: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.shelf-book__author { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shelf-book__prices { display: flex; align-items: baseline; gap: 7px; margin-top: 8px; }
.shelf-book__price { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--accent); }
.shelf-book__old { font-size: 12.5px; color: var(--text-faint); text-decoration: line-through; }
.shelf-more {
  flex: 0 0 auto; width: 150px; height: 225px; align-self: flex-start;
  border: 1px dashed var(--border-strong); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  text-decoration: none; color: var(--text-muted); font-size: 13px; font-weight: 600; text-align: center;
  transition: border-color 160ms, color 160ms, background 160ms;
}
.shelf-more:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 4%, transparent); }
.shelf-more__ico { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-accent); display: flex; align-items: center; justify-content: center; color: var(--accent); }

/* ── QUICK NAV (reduced Актуальні добірки) ──── */
.quicknav { margin-bottom: 64px; }
.quicknav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qn-card {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  text-decoration: none; color: inherit; transition: border-color 160ms, background 160ms, box-shadow 160ms;
}
.qn-card:hover { border-color: color-mix(in oklab, var(--accent) 35%, var(--border)); background: color-mix(in oklab, var(--accent) 4%, var(--surface)); box-shadow: var(--shadow-sm); }
.qn-card__icon { width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px; background: var(--surface-accent); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.qn-card__name { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; }
.qn-card__count { font-size: 13px; font-weight: 600; color: var(--text-muted); font-family: var(--font-display); }

/* ── ЗА НАСТРОЄМ (mood tiles) ───────────────── */
.mood { margin-bottom: 64px; }
.mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.mood-card {
  display: flex; flex-direction: column; gap: 12px; padding: 22px 24px;
  background: var(--surface-accent); border: 1px solid var(--border); border-radius: 16px;
  text-decoration: none; color: inherit; min-height: 168px;
  transition: box-shadow 200ms ease-out, transform 200ms ease-out, border-color 200ms;
}
.mood-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: color-mix(in oklab, var(--accent) 25%, var(--border)); }
.mood-card__icon { width: 46px; height: 46px; border-radius: 12px; background: color-mix(in oklab, var(--accent) 12%, var(--surface)); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.mood-card__body { flex: 1; }
.mood-card__name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; margin-bottom: 6px; }
.mood-card__desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; }
.mood-card__count { font-size: 12px; font-weight: 600; color: var(--accent); }

/* ── НАЙБІЛЬШІ ЗНИЖКИ (BookCard grid) ───────── */
.disc { margin-bottom: 64px; }
.disc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.disc-grid .kn-book { cursor: pointer; }

/* ── ОБРАНЕ ЧИТАЧАМИ (Wishlist social proof — rose identity) ── */
[data-theme="light"] { --kn-rose: #BC5A57; }
[data-theme="dark"]  { --kn-rose: #E48E8A; }
.favreaders { margin-bottom: 64px; }
.favreaders-inner { border: 1px solid var(--border); border-radius: 20px; padding: 30px 34px 18px; }
[data-theme="light"] .favreaders-inner { background: color-mix(in oklab, var(--kn-rose) 7%, var(--surface)); border-color: color-mix(in oklab, var(--kn-rose) 20%, var(--border)); }
[data-theme="dark"] .favreaders-inner { background: color-mix(in oklab, var(--kn-rose) 13%, var(--surface)); border-color: color-mix(in oklab, var(--kn-rose) 28%, var(--border)); }
.fav-head { margin-bottom: 20px; }
.fav-eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--kn-rose); }
.fav-eyebrow svg { fill: currentColor; }
.fav-all { color: var(--kn-rose); }
.fav-rail {
  display: flex; gap: 24px; overflow-x: auto; padding: 6px 2px 16px;
  scroll-snap-type: x proximity; scroll-padding-left: 2px;
  scrollbar-width: thin; scrollbar-color: color-mix(in oklab, var(--kn-rose) 40%, transparent) transparent;
}
.fav-rail::-webkit-scrollbar { height: 6px; }
.fav-rail::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--kn-rose) 40%, transparent); border-radius: 999px; }
.fav-rail::-webkit-scrollbar-track { background: transparent; }
.fav-book { flex: 0 0 auto; width: 138px; scroll-snap-align: start; text-decoration: none; color: inherit; display: block; }
.fav-cover-wrap { width: 138px; height: 207px; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-md); transition: transform 200ms ease-out, box-shadow 200ms ease-out; }
.fav-book:hover .fav-cover-wrap { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.fav-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
.fav-book__title { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; line-height: 1.25; margin-top: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fav-book__author { font-size: 12px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav-saves { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 12.5px; font-weight: 600; color: var(--kn-rose); }
.fav-saves svg { fill: currentColor; flex-shrink: 0; }
.fav-more {
  flex: 0 0 auto; width: 138px; height: 207px; align-self: flex-start;
  border: 1px dashed color-mix(in oklab, var(--kn-rose) 45%, var(--border)); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  text-decoration: none; color: var(--kn-rose); font-size: 13px; font-weight: 600; text-align: center;
  transition: border-color 160ms, background 160ms;
}
.fav-more:hover { border-color: var(--kn-rose); background: color-mix(in oklab, var(--kn-rose) 6%, transparent); }
.fav-more__ico { width: 44px; height: 44px; border-radius: 50%; background: color-mix(in oklab, var(--kn-rose) 14%, var(--surface)); display: flex; align-items: center; justify-content: center; color: var(--kn-rose); }
.fav-more__ico svg { fill: currentColor; }

/* ── НЕДООЦІНЕНІ КНИГИ (hidden gems band) ───── */
.gems { margin-bottom: 64px; }
.gems-inner {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 48px;
  background: var(--surface-accent); border: 1px solid var(--border); border-radius: 20px;
  padding: 44px 48px; overflow: hidden;
}
[data-theme="light"] .gems-inner { background: color-mix(in oklab, var(--brand-green) 7%, var(--surface)); border-color: color-mix(in oklab, var(--brand-green) 18%, var(--border)); }
[data-theme="dark"] .gems-inner { background: color-mix(in oklab, var(--brand-green) 14%, var(--surface)); border-color: color-mix(in oklab, var(--brand-green) 30%, var(--border)); }
.gems-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: var(--brand-green); margin-bottom: 14px; }
[data-theme="dark"] .gems-eyebrow { color: #7FC9A3; }
.gems-eyebrow__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.gems-title { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 14px; max-width: 20ch; }
.gems-desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 52ch; margin-bottom: 22px; }
.gems-cta { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; transition: gap 160ms; }
.gems-cta:hover { gap: 12px; }
.gems-covers { display: flex; flex-shrink: 0; }
.gems-cover { display: block; width: 132px; height: 198px; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-lg); margin-left: -34px; transition: transform 220ms ease-out; transform: rotate(calc((var(--i) - 1) * 4deg)); }
.gems-cover:first-child { margin-left: 0; }
.gems-cover:hover { transform: translateY(-6px) rotate(0deg); z-index: 2; }
.gems-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ── НОВІ ДОБІРКИ (fresh collections) ───────── */
.fresh { margin-bottom: 72px; }
.fresh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.fresh-card {
  display: flex; flex-direction: column; gap: 12px; padding: 24px 26px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  text-decoration: none; color: inherit;
  transition: box-shadow 200ms ease-out, transform 200ms ease-out;
}
.fresh-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
.fresh-card__head { display: flex; align-items: center; gap: 10px; }
.fresh-card__icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-accent); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fresh-card__type { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.fresh-card__name { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.25; }
.fresh-card__desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; flex: 1; }
.fresh-card__covers { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--border); }
.fresh-card__covers img { width: 38px; height: 57px; object-fit: cover; border-radius: 4px; box-shadow: var(--shadow-sm); }
.fresh-card__count { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-muted); }

/* ── GENRE GRID (kept v1.0) ─────────────────── */
.genre-section { margin-bottom: 64px; }
.genre-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.genre-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; transition: box-shadow 160ms ease-out, border-color 160ms, background 160ms; }
.genre-card:hover { background: color-mix(in oklab, var(--accent) 5%, var(--surface)); border-color: color-mix(in oklab, var(--accent) 30%, var(--border)); box-shadow: var(--shadow-sm); }
.genre-card__icon { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.genre-card__body { flex: 1; min-width: 0; }
.genre-card__name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.genre-card__count { font-size: 12px; color: var(--text-muted); }
.genre-card__arrow { color: var(--text-muted); font-size: 14px; opacity: .5; }

/* ── AUTHOR CHIPS (kept v1.0) ───────────────── */
.authors-section { margin-bottom: 64px; }
.authors-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
.author-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; text-decoration: none; color: inherit; font-size: 14px; font-weight: 500; transition: border-color 160ms, background 160ms; }
.author-chip:hover { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 5%, var(--surface)); }
.author-chip__count { font-size: 12px; color: var(--text-muted); }

/* ── FOOTER (kept v1.0) ─────────────────────── */
.site-footer { border-top: 1px solid var(--border); padding: 48px 0 32px; }
.footer-inner { display: flex; align-items: flex-start; gap: 48px; }
.footer-brand { flex-shrink: 0; }
.footer-logo { height: 44px; margin-left: -6px; }
.footer-tagline { font-size: 13px; color: var(--text-muted); margin-top: 10px; max-width: 220px; line-height: 1.5; }
.footer-links { display: flex; gap: 48px; margin-left: auto; flex-wrap: wrap; }
.footer-col__title { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; }
.footer-col ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.footer-col a { font-size: 14px; color: var(--text-body); text-decoration: none; transition: color 140ms; }
.footer-col a:hover { color: var(--accent); }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }

/* ── DIVIDER ─────────────────────────────────── */
.page-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0 56px; }

/* ── Section entrance: pure-CSS load fade. Resolves to visible with no JS dependency. ── */
@keyframes kn-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.reveal { animation: kn-rise 620ms ease-out both; }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
@media print { .reveal { animation: none !important; } }

/* ── RESPONSIVE ─────────────────────────────── */
@media (max-width: 1024px) {
  .quicknav-grid { grid-template-columns: repeat(2, 1fr); }
  .mood-grid { grid-template-columns: repeat(2, 1fr); }
  .fresh-grid { grid-template-columns: 1fr; }
  .genre-grid { grid-template-columns: repeat(3, 1fr); }
  .gems-covers { display: none; }
