<!DOCTYPE html>
<!-- Knyhovo Collections Landing v3.0 / Iteration 2 — 2026-07-02.
     One universal Book Card everywhere · calmer premium rhythm · alternating tinted bands ·
     «Обране читачами» moved below the hero · «Актуальні добірки» removed · cross-section dedup.
     The «Книговик радить» featured block is kept EXACTLY as v1.0 (frozen).
     Composes DS v1.0 tokens/components only; line icons only. Logic in collections-app.jsx. -->
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Добірки — Knyhovo</title>

<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/tokens/fonts.css">
<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/tokens/colors.css">
<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/tokens/typography.css">
<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/tokens/spacing.css">
<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/tokens/effects.css">
<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/tokens/base.css">
<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/styles/components.css">
<link rel="stylesheet" href="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/_ds_bundle.js"></script>

<style>
/* ── LAYOUT ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }
.page { max-width: 1320px; margin: 0 auto; padding: 0 48px; }

/* Rose accent used by the «Обране читачами» band + its card badge */
[data-theme="light"] { --kn-rose: #BC5A57; }
[data-theme="dark"]  { --kn-rose: #E48E8A; }

/* ── HEADER (frozen v1.0 pattern) ───────────── */
.site-header { display: flex; align-items: center; gap: var(--space-8); height: 72px; }
.site-brand { display: flex; align-items: center; }
.site-logo { height: 64px; display: block; margin-left: -9px; }
.site-nav { display: flex; gap: 32px; margin-left: auto; }
.nav-link { font-size: 16px; font-weight: 500; color: var(--text-body); transition: color 140ms ease-out; text-decoration: none; }
.nav-link:hover { color: var(--accent); }
.nav-link--active { color: var(--accent); font-weight: 600; }
.site-actions { display: flex; align-items: center; gap: var(--space-5); margin-left: var(--space-8); margin-right: -9px; }
.site-actions .kn-btn { height: 40px; padding: 0 20px; font-size: 14px; font-weight: 600; border-radius: 10px; }

/* ── SECTION RHYTHM ─────────────────────────────
   Each section is a full-width block; plain ones breathe on the page bg,
   banded ones flood-fill a soft tint so topics read as independent blocks. */
.sec { padding-block: 52px; }
.sec--hero { padding-block: 0; }
.band { padding-block: 84px; }
[data-theme="light"] .band--rose  { background: color-mix(in oklab, var(--kn-rose) 6.5%, var(--bg)); }
[data-theme="dark"]  .band--rose  { background: color-mix(in oklab, var(--kn-rose) 11%, var(--bg)); }
[data-theme="light"] .band--green { background: color-mix(in oklab, var(--brand-green) 6%, var(--bg)); }
[data-theme="dark"]  .band--green { background: color-mix(in oklab, var(--brand-green) 13%, var(--bg)); }
.band--warm { background: var(--surface-accent); }

/* ── SECTION HEADER ─────────────────────────── */
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.sec-head__left { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sec-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
.sec-eyebrow--rose { display: inline-flex; align-items: center; gap: 7px; }
.sec-title { font-family: var(--font-display); font-size: 1.85rem; font-weight: 700; line-height: 1.14; letter-spacing: -0.01em; }
.sec-sub { font-size: 14.5px; color: var(--text-muted); line-height: 1.55; max-width: 60ch; margin-top: 6px; text-wrap: pretty; }
.sec-all { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; transition: opacity 140ms; padding-bottom: 3px; }
.sec-all:hover { opacity: .68; }
/* Band-tinted eyebrow + link accents */
.band--rose  .sec-eyebrow, .band--rose  .sec-all { color: var(--kn-rose); }
.band--green .sec-eyebrow, .band--green .sec-all { color: var(--brand-green); }
[data-theme="dark"] .band--green .sec-eyebrow, [data-theme="dark"] .band--green .sec-all { color: #7FC9A3; }

/* ── FROZEN v1.0 — «Книговик радить» FEATURED CARD (DO NOT EDIT) ── */
.feat-card {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: 28px; padding: 18px 32px; height: 204px; overflow: hidden;
  background: var(--surface-accent); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-sm);
  margin-bottom: 64px; margin-top: 56px; text-decoration: none; color: inherit;
  transition: box-shadow 200ms ease-out, transform 200ms ease-out;
}
.feat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
[data-theme="dark"] .feat-card { background: #0a0909; }
[data-theme="light"] .feat-card { background: #f2dbc1; }
.feat-mascot {
  width: 236px; height: 163px; object-fit: cover; flex-shrink: 0; display: block;
  -webkit-mask-image: radial-gradient(ellipse 60% 66% at 50% 50%, #000 46%, transparent 78%);
  mask-image: radial-gradient(ellipse 60% 66% at 50% 50%, #000 46%, transparent 78%);
}
.feat-body { flex: 1; }
.feat-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
.feat-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.feat-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
.feat-desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 52ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.feat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.feat-count { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
.feat-count-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; text-align: right; }

/* ═══ UNIVERSAL BOOK CARD — one component used in every book section ═══
   White card · 18px radius · subtle shadow · cover on top · aligned metadata.
   Whole card is one clickable object; calm lift + gentle cover scale on hover. */
.book-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.bkc {
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 14px; text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: transform 200ms ease-out, box-shadow 200ms ease-out, border-color 200ms ease-out;
}
.bkc:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in oklab, var(--accent) 22%, var(--border)); }
.bkc__coverwrap { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 2 / 3; background: var(--surface-accent); box-shadow: var(--shadow-sm); }
.bkc__cover { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 220ms ease-out; }
.bkc:hover .bkc__cover { transform: scale(1.03); }
.bkc__badge {
  position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; line-height: 1;
  box-shadow: var(--shadow-sm);
}
.bkc__badge svg { width: 12px; height: 12px; flex-shrink: 0; }
.bkc__badge--accent { background: var(--accent); color: var(--text-on-accent); }
.bkc__badge--green  { background: var(--brand-green); color: #fff; }
.bkc__badge--rose   { background: var(--kn-rose); color: #fff; }
.bkc__badge--rating { background: var(--text); color: var(--bg); }
.bkc__body { display: flex; flex-direction: column; flex: 1; padding: 15px 4px 4px; }
.bkc__title { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.25; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
.bkc__author { font-size: 13px; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bkc__foot { display: flex; align-items: baseline; gap: 8px; margin-top: auto; padding-top: 12px; }
.bkc__price { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent); }
.bkc__old { font-size: 13px; color: var(--text-faint); text-decoration: line-through; }

/* ── ЩО ЧИТАТИ СЬОГОДНІ (mood tiles) ────────── */
.mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.mood-card {
  display: flex; flex-direction: column; gap: 12px; padding: 22px 24px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  text-decoration: none; color: inherit; min-height: 168px;
  transition: box-shadow 200ms ease-out, transform 200ms ease-out, border-color 200ms;
}
.mood-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: color-mix(in oklab, var(--accent) 25%, var(--border)); }
.mood-card__icon { width: 46px; height: 46px; border-radius: 12px; background: color-mix(in oklab, var(--accent) 12%, var(--surface)); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.mood-card__body { flex: 1; }
.mood-card__name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; margin-bottom: 6px; }
.mood-card__desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; }
.mood-card__count { font-size: 12px; font-weight: 600; color: var(--accent); }

/* ── ЩОЙНО ЗІБРАЛИ (fresh editorial collections) ── */
.fresh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.fresh-card {
  display: flex; flex-direction: column; gap: 12px; padding: 24px 26px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  text-decoration: none; color: inherit;
  transition: box-shadow 200ms ease-out, transform 200ms ease-out;
}
.fresh-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
.fresh-card__head { display: flex; align-items: center; gap: 10px; }
.fresh-card__icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-accent); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fresh-card__type { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.fresh-card__name { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.25; }
.fresh-card__desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; flex: 1; }
.fresh-card__covers { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--border); }
.fresh-card__covers img { width: 38px; height: 57px; object-fit: cover; border-radius: 4px; box-shadow: var(--shadow-sm); }
.fresh-card__count { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-muted); }

/* ── ЗА ЖАНРОМ (navigation grid) ────────────── */
.genre-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.genre-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; transition: box-shadow 160ms ease-out, border-color 160ms, background 160ms; }
.genre-card:hover { background: color-mix(in oklab, var(--accent) 5%, var(--surface)); border-color: color-mix(in oklab, var(--accent) 30%, var(--border)); box-shadow: var(--shadow-sm); }
.genre-card__icon { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.genre-card__body { flex: 1; min-width: 0; }
.genre-card__name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.genre-card__count { font-size: 12px; color: var(--text-muted); }
.genre-card__arrow { color: var(--text-muted); font-size: 14px; opacity: .5; }

/* ── FOOTER (kept v1.0) ─────────────────────── */
.site-footer { border-top: 1px solid var(--border); padding: 48px 0 32px; margin-top: 40px; }
.footer-inner { display: flex; align-items: flex-start; gap: 48px; }
.footer-brand { flex-shrink: 0; }
.footer-logo { height: 44px; margin-left: -6px; }
.footer-tagline { font-size: 13px; color: var(--text-muted); margin-top: 10px; max-width: 220px; line-height: 1.5; }
.footer-links { display: flex; gap: 48px; margin-left: auto; flex-wrap: wrap; }
.footer-col__title { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; }
.footer-col ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.footer-col a { font-size: 14px; color: var(--text-body); text-decoration: none; transition: color 140ms; }
.footer-col a:hover { color: var(--accent); }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }

/* ── DIVIDER (between consecutive plain sections) ── */
.page-divider { border: none; border-top: 1px solid var(--border); margin: 0; }

/* ── Section entrance: pure-CSS load fade (no JS gating). ── */
@keyframes kn-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.reveal { animation: kn-rise 620ms ease-out both; }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
@media print { .reveal { animation: none !important; } }

/* ── RESPONSIVE ─────────────────────────────── */
@media (max-width: 1119px) {
  .book-grid { grid-template-columns: repeat(3, 1fr); }
  .mood-grid { grid-template-columns: repeat(2, 1fr); }
  .fresh-grid { grid-template-columns: 1fr; }
  .genre-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {
  .page { padding: 0 20px; }
  .site-nav { display: none; }
  .site-actions .kn-btn:not(.kn-btn--icon) { display: none; }
  /* FROZEN featured — mobile v1.0 */
  .feat-card { grid-template-columns: 1fr; gap: 16px; padding: 20px; height: auto; overflow: visible; margin-top: 32px; margin-bottom: 44px; }
  .feat-mascot { margin: 0 auto; }
  .feat-meta { flex-direction: row; align-items: center; }
  .feat-meta .kn-btn { margin-left: auto; }
  .sec-title { font-size: 1.55rem; }
  .sec { padding-block: 40px; }
  .band { padding-block: 56px; }
  .book-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .mood-grid { grid-template-columns: 1fr; }
  .genre-grid { grid-template-columns: repeat(2, 1fr); }
  .bkc__title { font-size: 15px; }
  .footer-inner { flex-direction: column; gap: 32px; }
  .footer-links { gap: 28px; }
}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="collections-app.jsx"></script>
</body>
</html>
