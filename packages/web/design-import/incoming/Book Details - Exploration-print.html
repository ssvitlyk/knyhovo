  /* ============================================================
     BOOK DETAILS EXPLORATION — page-level composition CSS only.
     Composes frozen v1.0 tokens; no new colors / type / radii.
     ============================================================ */

  /* ---------- Artboard page shell ---------- */
  .bd-page {
    background: var(--bg); color: var(--text-body);
    font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-normal);
    min-height: 100%;
  }
  .bd-wrap { padding: 0 48px; }

  /* Exploration banner — required label on every output */
  .bd-note {
    background: var(--surface-accent); border-bottom: 1px solid var(--border);
    color: var(--text-muted); font-size: var(--fs-xs);
    letter-spacing: var(--ls-eyebrow); text-transform: uppercase;
    padding: var(--space-2) 48px;
  }
  .bd-note b { color: var(--accent); font-weight: var(--fw-semibold); }

  /* ---------- Header / footer (reused from approved patterns) ---------- */
  .bd-page .site-header { display: flex; align-items: center; gap: var(--space-8); padding: var(--space-5) 0; }
  .bd-page .site-logo { height: 44px; display: block; }
  .bd-page .site-nav { display: flex; gap: var(--space-6); margin-left: auto; }
  .bd-page .nav-link { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-body); transition: color var(--dur-fast) var(--ease-out); }
  .bd-page .nav-link:hover { color: var(--accent); }
  .bd-page .nav-link--active { color: var(--accent); font-weight: var(--fw-semibold); }
  .bd-page .site-actions { display: flex; align-items: center; gap: var(--space-4); }
  .bd-page .site-footer {
    border-top: 1px solid var(--border);
    margin-top: var(--space-12);
    padding: var(--space-10) 0 var(--space-12);
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3);
  }
  .bd-page .footer-logo { height: 36px; }
  .bd-page .footer-line { font-size: var(--fs-sm); color: var(--text-body); }
  .bd-page .footer-copy { font-size: var(--fs-xs); color: var(--text-muted); }

  /* ---------- Top bar: persistent search + breadcrumbs ---------- */
  .bd-topbar { display: flex; align-items: center; gap: var(--space-6); margin: var(--space-2) 0 var(--space-5); }
  .bd-search { flex: 1; max-width: 640px; }
  .bd-crumbs { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: var(--space-8); }
  .bd-crumbs span { color: var(--text); }

  /* ---------- Shared blocks ---------- */
  .bd-eyebrow {
    font-size: var(--fs-xs); letter-spacing: var(--ls-eyebrow); text-transform: uppercase;
    color: var(--text-muted); margin-bottom: var(--space-3);
  }
  .bd-h1 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h2); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); color: var(--text); margin-bottom: var(--space-2); text-wrap: pretty; }
  .bd-h1--display { font-size: var(--fs-h1); }
  .bd-h2 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3); line-height: var(--lh-snug); color: var(--text); margin-bottom: var(--space-5); }
  .bd-author { font-size: var(--fs-lead); color: var(--text-body); margin-bottom: var(--space-5); }

  .bd-cover {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--surface-accent), var(--surface-sunk));
    box-shadow: var(--shadow-md);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .bd-cover span { font-size: var(--fs-xs); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-faint); }
  .bd-cover--lg { width: 300px; height: 440px; }
  .bd-cover--md { width: 220px; height: 320px; }
  .bd-cover--sm { width: 120px; height: 174px; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }

  .bd-desc p { margin: 0 0 var(--space-4); max-width: 66ch; text-wrap: pretty; }
  .bd-desc p:last-child { margin-bottom: 0; }
  .bd-lead { font-size: var(--fs-lead); color: var(--text); }

  .bd-series-box {
    display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
    background: var(--surface-sunk); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: var(--space-4) var(--space-5);
    margin: var(--space-6) 0;
  }
  .bd-series-box b { font-family: var(--font-display); font-weight: var(--fw-semibold); color: var(--text); }
  .bd-series-box .bd-series-note { font-size: var(--fs-sm); color: var(--text-muted); }
  .bd-series-box .kn-btn { margin-left: auto; }

  .bd-wish { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

  /* Metadata definition grid */
  .bd-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5) var(--space-10); max-width: 720px; margin: 0; }
  .bd-meta dt { font-size: var(--fs-xs); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
  .bd-meta dd { margin: 0; color: var(--text); font-weight: var(--fw-medium); }
  .bd-meta dd.bd-meta--missing { color: var(--text-faint); font-weight: var(--fw-regular); }

  .bd-section { margin: var(--space-12) 0 0; }
  .bd-summary { font-size: var(--fs-sm); color: var(--text-muted); margin: calc(-1 * var(--space-3)) 0 var(--space-5); }

  /* ---------- Offer rows (price comparison) ---------- */
  .bd-offers { display: flex; flex-direction: column; gap: var(--space-3); }
  .bd-offer {
    display: grid; grid-template-columns: minmax(150px, 1fr) auto auto auto;
    align-items: center; gap: var(--space-6);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
    padding: var(--space-4) var(--space-5);
  }
  .bd-offer--best {
    border-color: color-mix(in oklab, var(--accent) 45%, var(--border));
    box-shadow: var(--shadow-md);
    padding: var(--space-5);
  }
  .bd-offer--out { opacity: 0.72; box-shadow: none; }
  .bd-offer__store { display: flex; align-items: center; gap: var(--space-3); font-weight: var(--fw-semibold); color: var(--text); min-width: 0; }
  .bd-offer__avail { font-size: var(--fs-sm); white-space: nowrap; }
  .bd-offer__avail--in { color: var(--brand-green); }
  .bd-offer__avail--low { color: var(--accent); }
  .bd-offer__avail--out { color: var(--text-faint); }
  .bd-offer__pricecell { display: flex; align-items: baseline; gap: var(--space-2); justify-content: flex-end; white-space: nowrap; }
  .bd-offer__old { font-size: var(--fs-sm); color: var(--text-muted); text-decoration: line-through; }
  .bd-offer__price { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: 1.5rem; color: var(--accent); }
  .bd-offer--best .bd-offer__price { font-size: 1.875rem; }
  .bd-offer--out .bd-offer__price { color: var(--text-faint); }
  .bd-offers--compact .bd-offer { padding: var(--space-3) var(--space-4); gap: var(--space-5); }
  .bd-offers--compact .bd-offer__price { font-size: 1.25rem; }
  .bd-offers--compact .bd-offer--best { padding: var(--space-4); }
  .bd-offers--compact .bd-offer--best .bd-offer__price { font-size: 1.5rem; }
  .bd-updated { font-size: var(--fs-xs); color: var(--text-muted); margin-top: var(--space-3); }

  /* ---------- Variant B — best-price hero ---------- */
  .bdb-hero {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-8); align-items: center;
    background: var(--surface); border: 1px solid color-mix(in oklab, var(--accent) 45%, var(--border));
    border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    padding: var(--space-6) var(--space-8);
  }
  .bdb-hero__id { display: flex; gap: var(--space-5); align-items: center; min-width: 0; }
  .bdb-hero__deal { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-3); }
  .bdb-hero__pricerow { display: flex; align-items: baseline; gap: var(--space-3); }
  .bdb-hero__price { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: 2.75rem; line-height: 1; color: var(--accent); white-space: nowrap; }
  .bdb-hero__old { font-size: var(--fs-title); color: var(--text-muted); text-decoration: line-through; }
  .bdb-hero__store { font-size: var(--fs-sm); color: var(--text-muted); }
  .bdb-hero__store b { color: var(--text); font-weight: var(--fw-semibold); }

  /* ---------- Variant C — two-pane ---------- */
  .bdc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: var(--space-12); align-items: start; }
  .bdc-idrow { display: flex; gap: var(--space-8); margin-bottom: var(--space-8); }
  .bdc-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    padding: var(--space-6);
  }
  .bdc-best {
    background: var(--accent-weak); border-radius: var(--radius-md);
    padding: var(--space-5); margin: var(--space-4) 0 var(--space-2);
  }
  .bdc-best__pricerow { display: flex; align-items: baseline; gap: var(--space-3); margin: var(--space-2) 0 var(--space-1); }
  .bdc-best__price { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: 2.25rem; line-height: 1; color: var(--accent); }
  .bdc-best__old { font-size: var(--fs-body); color: var(--text-muted); text-decoration: line-through; }
  .bdc-best__store { font-size: var(--fs-sm); color: var(--text-body); margin-bottom: var(--space-4); }
  .bdc-best__store b { color: var(--text); }
  .bdc-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--border); }
  .bdc-row:first-of-type { border-top: none; }
  .bdc-row__store { font-weight: var(--fw-medium); color: var(--text); flex: 1; min-width: 0; }
  .bdc-row__avail { font-size: var(--fs-xs); white-space: nowrap; }
  .bdc-row__price { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: 1.25rem; color: var(--accent); white-space: nowrap; }
  .bdc-row__old { font-size: var(--fs-xs); color: var(--text-muted); text-decoration: line-through; white-space: nowrap; }
  .bdc-row--out { opacity: 0.66; }
  .bdc-row--out .bdc-row__price { color: var(--text-faint); }
  .bdc-panel .bd-wish { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--border); }

  /* ---------- Price-history placeholder (reserved space, no chart styles) ---------- */
  .bd-history {
    background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--space-6); min-height: 140px;
    display: flex; gap: var(--space-5); align-items: flex-start;
  }
  .bd-history__icon {
    width: 44px; height: 44px; flex: none; color: var(--icon-muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
  }
  .bd-history__titlerow { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
  .bd-history__title { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-title); color: var(--text); }
  .bd-history p { font-size: var(--fs-sm); color: var(--text-muted); max-width: 56ch; margin: 0; text-wrap: pretty; }

  /* ---------- Related shelves (page-level vertical override, approved precedent) ---------- */
  .bd-shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-5); }
  .bd-shelf .kn-book { flex-direction: column; }
  .bd-shelf .kn-book__cover { width: 104px; height: 150px; }

  /* ---------- Hints (partial-data state) ---------- */
  .bd-hint {
    display: flex; gap: var(--space-3); align-items: flex-start;
    background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--space-4) var(--space-5);
    font-size: var(--fs-sm); color: var(--text-muted); max-width: 66ch;
  }
  .bd-hint svg { flex: none; color: var(--icon-muted); margin-top: 1px; }

  /* ---------- Unavailable state (mascot guidance) ---------- */
  .bd-unavail { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-4) var(--space-4) var(--space-5); }
  .bd-unavail__mascot {
    height: 230px; object-fit: contain; margin-bottom: var(--space-4);
    -webkit-mask-image: radial-gradient(ellipse 68% 66% at 50% 52%, black 58%, transparent 97%);
    mask-image: radial-gradient(ellipse 68% 66% at 50% 52%, black 58%, transparent 97%);
  }
  .bd-unavail__title { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3); color: var(--text); margin-bottom: var(--space-2); }
  .bd-unavail__text { font-size: var(--fs-body); color: var(--text-body); max-width: 42ch; margin-bottom: var(--space-5); text-wrap: pretty; }

  /* ---------- Loading skeletons (frozen spec: warm surfaces, one-shot stagger) ---------- */
  .bd-sk { background: var(--surface-accent); border-radius: var(--radius-xs); }
  .bd-sk--card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  .kn-skeleton-search__icon { width: 20px; height: 20px; flex: none; border-radius: var(--radius-pill); }
  .kn-skeleton-search__query { height: 14px; width: 38%; }
  .kn-skeleton-search__button { width: 92px; height: var(--control-md); margin-left: auto; flex: none; border-radius: var(--radius-sm); background: var(--accent-weak); }
  @media (prefers-reduced-motion: no-preference) {
    .bd-stagger > * { animation: bd-fade-in 280ms var(--ease-out) both; }
    .bd-stagger > *:nth-child(2) { animation-delay: 50ms; }
    .bd-stagger > *:nth-child(3) { animation-delay: 100ms; }
    .bd-stagger > *:nth-child(4) { animation-delay: 150ms; }
    .bd-stagger > *:nth-child(5) { animation-delay: 200ms; }
    .bd-stagger > *:nth-child(6) { animation-delay: 250ms; }
    @keyframes bd-fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  }

  /* ============================================================
     DOC CARDS (overview + anatomy/rationale) — canvas documentation
     ============================================================ */
  .bd-doc { background: var(--bg); color: var(--text-body); font-family: var(--font-body); padding: var(--space-8); min-height: 100%; }
  .bd-doc__badge-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); flex-wrap: wrap; }
  .bd-doc h2 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3); line-height: var(--lh-snug); color: var(--text); margin-bottom: var(--space-2); }
  .bd-doc__sub { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: var(--space-2); }
  .bd-doc h3 { font-size: var(--fs-xs); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-muted); font-weight: var(--fw-semibold); margin: var(--space-6) 0 var(--space-3); }
  .bd-doc p { font-size: var(--fs-sm); margin: 0 0 var(--space-3); text-wrap: pretty; }
  .bd-doc ol { padding-left: 1.3em; margin: 0; display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--fs-sm); }
  .bd-doc ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .bd-doc ul li { display: flex; gap: var(--space-2); font-size: var(--fs-sm); }
  .bd-doc .pro { color: var(--brand-green); font-weight: var(--fw-bold); flex: none; }
  .bd-doc .con { color: var(--accent); font-weight: var(--fw-bold); flex: none; }
  .bd-doc .uc { color: var(--text-faint); font-weight: var(--fw-bold); flex: none; }

  .anat { display: flex; flex-direction: column; gap: 6px; }
  .anat__row { display: flex; gap: 6px; }
  .anat__b {
    flex: 1; min-height: 30px; padding: 4px 6px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius-xs);
    font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted);
  }
  .anat__b--hot { background: var(--accent-weak); border-color: color-mix(in oklab, var(--accent) 55%, var(--border-strong)); color: var(--accent); font-weight: var(--fw-semibold); }
  .anat__b--dim { background: var(--surface-sunk); color: var(--text-faint); }
</style>

<script>
(async () => {
  // Prepend so page-supplied @page / break rules (deck-stage's margin:0,
  // author CSS) keep source-order precedence over the baseline.
  const baseCss = document.createElement('style');
  baseCss.textContent = "@media print {\n  @page { margin: 0.5cm; }\n  html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }\n  section, article, figure, table { break-inside: avoid; }\n  *, *::before, *::after {\n    animation-delay: -99s !important; animation-duration: .001s !important;\n    animation-iteration-count: 1 !important; animation-fill-mode: both !important;\n    animation-play-state: running !important; transition-duration: 0s !important;\n  }\n}";
  document.head.prepend(baseCss);
  if (document.readyState === 'loading') {
    await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
  }
  let ds = document.querySelector('deck-stage');
  // whenDefined never resolves when nothing registers the element, so only
  // await it when a <deck-stage> tag exists (and race a timeout regardless).
  if (ds && !customElements.get('deck-stage')) {
    try {
      await Promise.race([
        customElements.whenDefined('deck-stage'),
        new Promise((r) => setTimeout(r, 3000)),
      ]);
    } catch (e) {}
    ds = document.querySelector('deck-stage');
  }
  // dc-runtime assigns window.DCLogic at init and mounts into #dc-root on
  // DOMContentLoaded; settle on that subtree so React has rendered before
  // print(). Non-DC pages fall through to weighing body.
  const isDc = !ds && 'DCLogic' in window;
  const settleRoot = ds || (isDc ? document.getElementById('dc-root') : null) || document.body;
  if (settleRoot) {
    // Weigh only content children — skip script/style/template so inline
    // Babel/CSS doesn't register as stable "content" before the framework
    // has mounted anything.
    const MEDIA = 'img,svg,canvas,video,picture,iframe,embed,object';
    const weigh = () => {
      let text = 0, media = 0;
      for (const c of settleRoot.children) {
        const t = c.tagName;
        if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
        text += (c.textContent || '').trim().length;
        media += c.querySelectorAll(MEDIA).length + (c.matches(MEDIA) ? 1 : 0);
      }
      return text + media * 100;
    };
    // "Non-zero and stable" alone is not sufficient to mean rendered: generic
    // body can carry a static shell while async main content is pending, and
    // #dc-root can carry the root DC's static text while child refs are still
    // .sc-placeholder boxes. Gate generic on readyState 'complete', and never
    // accept stability while a dc-runtime placeholder is present.
    const isGeneric = settleRoot === document.body;
    const deadline = Date.now() + 15000;
    let last = -1, stable = 0;
    while (Date.now() < deadline) {
      const n = weigh();
      const ready =
        (!isGeneric || document.readyState === 'complete') &&
        !settleRoot.querySelector('.sc-placeholder');
      if (n > 0 && n === last && ready) { if (++stable >= 2) break; } else { stable = 0; }
      last = n;
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  try { await document.fonts.ready; } catch (e) {}
  // Jump every animation to its end state so print() never captures a slide
  // mid-entrance. Ordering matters: the 0s-transition style must be live
  // BEFORE data-deck-active is set so attribute-keyed transitions don't
  // start a (now-0s) run from the pre-active base.
  const st = document.createElement('style');
  st.textContent = '*,*::before,*::after{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}';
  document.head.appendChild(st);
  for (const d of document.querySelectorAll('deck-stage')) {
    for (const c of d.children) {
      const t = c.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
      c.setAttribute('data-deck-active', '');
    }
  }
  try {
    const sweep = () => {
      for (const a of document.getAnimations()) {
        try { a.finish(); } catch (e) {
          try { a.currentTime = (a.effect && a.effect.getComputedTiming().duration) || 0; a.pause(); } catch (e2) {}
        }
      }
    };
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
  } catch (e) {}
  setTimeout(() => { try { window.print(); } catch (e) {} }, 200);
})();
</script>
</body>
</html>
