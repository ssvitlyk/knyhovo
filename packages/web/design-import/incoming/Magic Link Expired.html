<head>
  <meta charset="utf-8">

</head>
<body>
  <div id="expired-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="_ds/knyhovo-design-system-9fa6168a-5230-4cbe-8edd-23fe0c07a170/_ds_bundle.js"></script>
  <script type="text/babel" src="np-shared.jsx"></script>
  <script type="text/babel" src="ml-shared.jsx"></script>
  <script type="text/babel">
    function ExpiredPage() {
      const [mobile, setMobile] = React.useState(() => window.matchMedia('(max-width: 767px)').matches);
      React.useEffect(() => {
        const mq = window.matchMedia('(max-width: 767px)');
        const fn = (e) => setMobile(e.matches);
        mq.addEventListener('change', fn);
        return () => mq.removeEventListener('change', fn);
      }, []);
      const theme = document.documentElement.getAttribute('data-theme') || 'light';
      return <window.ML_Frame variant="invalid" mobile={mobile} theme={theme} />;
    }
    ReactDOM.createRoot(document.getElementById('expired-root')).render(<ExpiredPage />);
  </script>
